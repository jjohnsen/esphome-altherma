packages:
  base: !include base.yaml

esphome:
  name: esphome-altherma-m5stack
  friendly_name: ESPHome Altherma
  name_add_mac_suffix: false

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# OTA is required for Over-the-Air updating
ota:
  - platform: esphome
    password: !secret ota_password

esp32:
  board: m5stack-core-esp32
  framework:
    type: esp-idf

# To be able to get logs from the device via serial and api.
logger:
  level: DEBUG # Set to INFO on production

sensor:
  - platform: uptime
    name: "Uptime"
    id: uptime_s

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_sensor
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_addr
    ssid:
      name: "SSID"
      id: ssid_name

globals:
  - id: ui_selected_index
    type: int
    restore_value: no
    initial_value: '0'
  - id: ui_detail_mode
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: dark_mode
    type: bool
    restore_value: yes
    initial_value: 'true'

# Switch for controlling the dark mode on the M5Stack display
switch:
  - platform: template
    name: "M5 Dark Mode"
    id: m5_dark_mode_switch
    icon: "mdi:theme-light-dark"
    lambda: |-
      return id(dark_mode);
    turn_on_action:
      - lambda: |-
          id(dark_mode) = true;
      - component.update: m5_display
    turn_off_action:
      - lambda: |-
          id(dark_mode) = false;
      - component.update: m5_display

# Backlight control
output:
  - platform: ledc
    pin: GPIO32
    id: backlight_output

light:
  - platform: monochromatic
    output: backlight_output
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0.5s
    internal: true

# Backlight timeout and UI navigation scripts
script:
  - id: backlight_timer
    mode: restart
    then:
      - light.turn_on:
          id: backlight
          brightness: 100%
      - delay: 20s
      - light.turn_on:
          id: backlight
          brightness: 30%
      - delay: 300s
      - light.turn_off: backlight

  - id: ui_prev
    then:
      - lambda: |-
          int item_count = 0;
          for (auto *s : App.get_sensors())        { if (!s->is_internal()) item_count++; }
          for (auto *s : App.get_text_sensors())   { if (!s->is_internal()) item_count++; }
          for (auto *s : App.get_binary_sensors()) { if (!s->is_internal()) item_count++; }
          for (auto *s : App.get_switches())       { if (!s->is_internal()) item_count++; }
          if (item_count <= 0) { id(ui_selected_index) = 0; return; }
          id(ui_selected_index) = (id(ui_selected_index) - 1 + item_count) % item_count;
      - component.update: m5_display

  - id: ui_next
    then:
      - lambda: |-
          int item_count = 0;
          for (auto *s : App.get_sensors())        { if (!s->is_internal()) item_count++; }
          for (auto *s : App.get_text_sensors())   { if (!s->is_internal()) item_count++; }
          for (auto *s : App.get_binary_sensors()) { if (!s->is_internal()) item_count++; }
          for (auto *s : App.get_switches())       { if (!s->is_internal()) item_count++; }
          if (item_count <= 0) { id(ui_selected_index) = 0; return; }
          id(ui_selected_index) = (id(ui_selected_index) + 1) % item_count;
      - component.update: m5_display

  - id: ui_toggle_detail
    then:
      - lambda: |-
          // Build unified list with the same item types
          struct Entry { void *ptr; uint8_t type; };
          std::vector<Entry> items;
          items.reserve(64);
          for (auto *s : App.get_sensors())        { if (!s->is_internal()) items.push_back({s, 0}); }
          for (auto *s : App.get_text_sensors())   { if (!s->is_internal()) items.push_back({s, 1}); }
          for (auto *s : App.get_binary_sensors()) { if (!s->is_internal()) items.push_back({s, 2}); }
          for (auto *s : App.get_switches())       { if (!s->is_internal()) items.push_back({s, 3}); }

          auto entry_name = [](const Entry &e) -> const char * {
            if (e.type == 0) return static_cast<sensor::Sensor *>(e.ptr)->get_name().c_str();
            if (e.type == 1) return static_cast<text_sensor::TextSensor *>(e.ptr)->get_name().c_str();
            if (e.type == 2) return static_cast<binary_sensor::BinarySensor *>(e.ptr)->get_name().c_str();
            return static_cast<switch_::Switch *>(e.ptr)->get_name().c_str();
          };
          std::sort(items.begin(), items.end(), [&entry_name](const Entry &a, const Entry &b) {
            return strcmp(entry_name(a), entry_name(b)) < 0;
          });

          if (!items.empty()) {
            int selected = (id(ui_selected_index) % items.size() + items.size()) % items.size();
            // If the selected item is a switch (like the Dark Mode), toggle its state immediately!
            if (items[selected].type == 3) {
              static_cast<switch_::Switch *>(items[selected].ptr)->toggle();
              id(ui_detail_mode) = false;
              return;
            }
          }
          // For the remaining sensors, open the normal detail view
          id(ui_detail_mode) = !id(ui_detail_mode);
      - component.update: m5_display
  
# M5Stack buttons
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    name: "M5 Button A"
    id: button_a
    internal: true
    on_press:
      - script.execute: backlight_timer
      - script.execute: ui_prev

  - platform: gpio
    pin:
      number: GPIO38
      inverted: true
    name: "M5 Button B"
    id: button_b
    internal: true
    on_press:
      - script.execute: backlight_timer
      - script.execute: ui_next

  - platform: gpio
    pin:
      number: GPIO37
      inverted: true
    name: "M5 Button C"
    id: button_c
    internal: true
    on_press:
      - script.execute: backlight_timer
      - script.execute: ui_toggle_detail

  - platform: template
    name: "Altherma Update Running"
    id: altherma_updating
    internal: true

font:
  - file: "gfonts://Roboto@700"
    id: font_small
    size: 16
    extras:
      - file: "gfonts://Roboto@700"
        glyphs: ["⁄", "●"]
  - file: "gfonts://Roboto@700"
    id: font_large
    size: 28
    extras:
      - file: "gfonts://Roboto@700"
        glyphs: ["⁄"]

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

# Keep available for optional graphing
color:
  - id: my_green
    hex: 00FF00

graph:
  - id: wifi_graph
    duration: 300min
    width: 300
    height: 120
    border: true
    traces:
      - sensor: wifi_signal_sensor
        line_thickness: 3
        color: my_green

display:
  - platform: mipi_spi
    id: m5_display
    model: M5CORE
    rotation: 0

    lambda: |-
      bool dark = id(dark_mode);

      // Dynamic color palette
      Color bg_color       = dark ? Color::BLACK : Color::WHITE;
      Color header_bg      = dark ? Color(0x18, 0x18, 0x18) : Color(0xE0, 0xE0, 0xE0);
      Color header_title   = dark ? Color(0xFF, 0xCC, 0x00) : Color(0x00, 0x55, 0xAA);
      Color text_default   = dark ? Color::WHITE : Color::BLACK;
      Color text_highlight = dark ? Color(0xFF, 0xEB, 0x3B) : Color(0x00, 0x66, 0xCC);
      Color detail_label   = dark ? Color(0x64, 0xB5, 0xF6) : Color(0x00, 0x77, 0x99);
      Color hint_color     = dark ? Color(0x80, 0x80, 0x80) : Color(0x66, 0x66, 0x66);

      // Background
      it.fill(bg_color);

      // Header bar
      it.filled_rectangle(0, 0, 320, 26, header_bg);
      it.printf(8, 5, id(font_small), header_title, "%s", App.get_name().c_str());

      // WiFi signal indicator
      if (id(wifi_signal_sensor).has_state()) {
        int rssi = (int)id(wifi_signal_sensor).state;
        const char *wifi_label = "WiFi";
        Color wifi_color = text_default;
        if (rssi > -60) {
          wifi_label = "WiFi●●●";
          wifi_color = dark ? Color(0x4C, 0xAF, 0x50) : Color(0x2E, 0x7D, 0x32);
        } else if (rssi > -80) {
          wifi_label = "WiFi● ●";
          wifi_color = dark ? Color(0xFF, 0x9C, 0x00) : Color(0xEF, 0x6C, 0x00);
        } else {
          wifi_label = "WiFi●";
          wifi_color = dark ? Color(0xF4, 0x43, 0x36) : Color(0xC6, 0x28, 0x28);
        }
        it.printf(216, 5, id(font_small), wifi_color, "%s", wifi_label);
      } else {
        it.printf(236, 5, id(font_small), text_default, "WiFi?");
      }

      // Build unified sorted list: 0=sensor, 1=text_sensor, 2=binary_sensor, 3=switch
      struct Entry { void *ptr; uint8_t type; };
      std::vector<Entry> items;
      items.reserve(64);
      for (auto *s : App.get_sensors())        { if (!s->is_internal()) items.push_back({s, 0}); }
      for (auto *s : App.get_text_sensors())   { if (!s->is_internal()) items.push_back({s, 1}); }
      for (auto *s : App.get_binary_sensors()) { if (!s->is_internal()) items.push_back({s, 2}); }
      for (auto *s : App.get_switches())       { if (!s->is_internal()) items.push_back({s, 3}); }

      auto entry_name = [](const Entry &e) -> const char * {
        if (e.type == 0) return static_cast<sensor::Sensor *>(e.ptr)->get_name().c_str();
        if (e.type == 1) return static_cast<text_sensor::TextSensor *>(e.ptr)->get_name().c_str();
        if (e.type == 2) return static_cast<binary_sensor::BinarySensor *>(e.ptr)->get_name().c_str();
        return static_cast<switch_::Switch *>(e.ptr)->get_name().c_str();
      };
      std::sort(items.begin(), items.end(), [&entry_name](const Entry &a, const Entry &b) {
        return strcmp(entry_name(a), entry_name(b)) < 0;
      });

      const int item_count = static_cast<int>(items.size());
      if (item_count <= 0) return;

      const int selected = (id(ui_selected_index) % item_count + item_count) % item_count;
      const int first_visible = (selected / 6) * 6;

      auto render_row = [&](const Entry &e, int y, bool active) {
        const Color fg = active ? text_highlight : text_default;
        const char *pfx = active ? ">" : " ";
        const char *name = entry_name(e);
        if (e.type == 0) {
          auto *s = static_cast<sensor::Sensor *>(e.ptr);
          const int dec = s->get_accuracy_decimals() >= 0 ? s->get_accuracy_decimals() : 1;
          const auto uref = s->get_unit_of_measurement_ref();
          const char *unit = uref.empty() ? "" : uref.c_str();
          if (s->has_state())
            it.printf(6, y, id(font_small), fg, "%s %s: %.*f %s", pfx, name, dec, s->state, unit);
          else
            it.printf(6, y, id(font_small), fg, "%s %s: --", pfx, name);
        } else if (e.type == 1) {
          auto *s = static_cast<text_sensor::TextSensor *>(e.ptr);
          if (s->has_state())
            it.printf(6, y, id(font_small), fg, "%s %s: %s", pfx, name, s->state.c_str());
          else
            it.printf(6, y, id(font_small), fg, "%s %s: --", pfx, name);
        } else if (e.type == 2) {
          auto *s = static_cast<binary_sensor::BinarySensor *>(e.ptr);
          if (s->has_state())
            it.printf(6, y, id(font_small), fg, "%s %s: %s", pfx, name, s->state ? "ON" : "OFF");
          else
            it.printf(6, y, id(font_small), fg, "%s %s: --", pfx, name);
        } else {
          auto *s = static_cast<switch_::Switch *>(e.ptr);
          it.printf(6, y, id(font_small), fg, "%s %s: %s", pfx, name, s->state ? "ON" : "OFF");
        }
      };

      if (!id(ui_detail_mode)) {
        int line_y = 34;
        for (int i = first_visible; i < std::min(first_visible + 6, item_count); i++) {
          render_row(items[i], line_y, i == selected);
          line_y += 32;
        }
      } else {
        const Entry &e = items[selected];
        const char *name = entry_name(e);
        it.printf(10, 38, id(font_small), detail_label, "Selected item:");
        it.printf(10, 64, id(font_small), text_default, "%s", name);

        if (e.type == 0) {
          auto *s = static_cast<sensor::Sensor *>(e.ptr);
          const int dec = s->get_accuracy_decimals() >= 0 ? s->get_accuracy_decimals() : 1;
          const auto uref = s->get_unit_of_measurement_ref();
          const char *unit = uref.empty() ? "" : uref.c_str();
          if (s->has_state()) {
            it.printf(10, 106, id(font_large), text_highlight, "%.*f", dec, s->state);
            it.printf(10, 148, id(font_small), text_default, "%s", unit);
          } else {
            it.printf(10, 106, id(font_large), text_default, "--");
          }
        } else if (e.type == 1) {
          auto *s = static_cast<text_sensor::TextSensor *>(e.ptr);
          it.printf(10, 106, id(font_small), text_default, "%s", s->has_state() ? s->state.c_str() : "--");
        } else if (e.type == 2) {
          auto *s = static_cast<binary_sensor::BinarySensor *>(e.ptr);
          it.printf(10, 106, id(font_large), text_default, "%s", s->has_state() ? (s->state ? "ON" : "OFF") : "--");
        } else {
          auto *s = static_cast<switch_::Switch *>(e.ptr);
          it.printf(10, 106, id(font_large), text_highlight, "%s", s->state ? "ON" : "OFF");
        }
      }
      // Bottom button hints
      it.filled_rectangle(0, 218, 320, 22, header_bg);

      if (!id(ui_detail_mode)) {
        it.printf(8, 221, id(font_small), hint_color,
                  "A: Prev    B: Next    C: Select");
      } else {
        it.printf(8, 221, id(font_small), hint_color,
                  "A: Prev    B: Next    C: Back");
      }      
