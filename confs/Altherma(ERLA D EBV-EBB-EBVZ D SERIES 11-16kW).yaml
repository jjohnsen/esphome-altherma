# Mapping for Daikin Altherma 3 (Outdoor: ERLA11D2V3 / Indoor: EBBH11DF6V)

# Âncoras base
.altherma_base: &altherma_base
  platform: altherma_hub
  altherma_hub_id: altherma_hub_1

.temp: &temp
  <<: *altherma_base
  device_class: temperature
  unit_of_measurement: "°C"
  state_class: measurement
  accuracy_decimals: 1

.pressure: &pressure
  <<: *altherma_base
  device_class: pressure
  unit_of_measurement: "bar"
  state_class: measurement
  accuracy_decimals: 2

.freq: &freq
  <<: *altherma_base
  unit_of_measurement: "Hz"
  state_class: measurement
  accuracy_decimals: 0

.current: &current
  <<: *altherma_base
  device_class: current
  unit_of_measurement: "A"
  state_class: measurement
  accuracy_decimals: 1

.binary: &binary
  <<: *altherma_base

.text: &text
  <<: *altherma_base

# Sensores Numéricos
sensor:
  # --- Temperaturas Exteriores e Circuito Frigorigéneo (0x20) ---
  - <<: *temp
    name: "Outdoor Air Temp (R1T)"
    register: 0x20
    offset: 0
    convid: 105
    datasize: 2

  - <<: *temp
    name: "Outdoor Heat Exchanger Temp (R4T)"
    register: 0x20
    offset: 2
    convid: 105
    datasize: 2

  - <<: *temp
    name: "Discharge Pipe Temp (R2T)"
    register: 0x20
    offset: 4
    convid: 105
    datasize: 2

  - <<: *temp
    name: "Suction Pipe Temp (R3T)"
    register: 0x20
    offset: 6
    convid: 105
    datasize: 2

  - <<: *temp
    name: "Liquid Pipe Temp (R6T)"
    register: 0x20
    offset: 10
    convid: 105
    datasize: 2

  - <<: *pressure
    name: "High Pressure"
    register: 0x20
    offset: 12
    convid: 105
    datasize: 2

  - <<: *pressure
    name: "Low Pressure"
    register: 0x20
    offset: 14
    convid: 105
    datasize: 2

  # --- Elétrica e Compressor (0x21, 0x30) ---
  - <<: *current
    name: "INV Primary Current"
    register: 0x21
    offset: 0
    convid: 105
    datasize: 2

  - <<: *temp
    name: "Inverter Fin Temp"
    register: 0x21
    offset: 4
    convid: 105
    datasize: 2

  - <<: *freq
    name: "Compressor Frequency"
    register: 0x30
    offset: 0
    convid: 152
    datasize: 1

  # --- Circuito Hidráulico Interior (0x60, 0x61, 0x62) ---
  - <<: *temp
    name: "Leaving Water Temp before BUH (R1T)"
    register: 0x61
    offset: 2
    convid: 105
    datasize: 2

  - <<: *temp
    name: "Leaving Water Temp after BUH (R2T)"
    register: 0x61
    offset: 4
    convid: 105
    datasize: 2

  - <<: *temp
    name: "Refrig Temp Liquid Side (R3T)"
    register: 0x61
    offset: 6
    convid: 105
    datasize: 2

  - <<: *temp
    name: "Inlet Water Temp (R4T)"
    register: 0x61
    offset: 8
    convid: 105
    datasize: 2

  - <<: *temp
    name: "DHW Tank Temp (R5T)"
    register: 0x61
    offset: 10
    convid: 105
    datasize: 2

  - <<: *temp
    name: "Indoor Ambient Temp (R1T)"
    register: 0x61
    offset: 12
    convid: 105
    datasize: 2

  - <<: *altherma_base
    name: "Flow Sensor"
    register: 0x62
    offset: 9
    convid: 105
    datasize: 2
    unit_of_measurement: "l/min"
    state_class: measurement
    accuracy_decimals: 1

  - <<: *pressure
    name: "Water Pressure"
    register: 0x62
    offset: 11
    convid: 105
    datasize: 1

  - <<: *temp
    name: "DHW Setpoint"
    register: 0x60
    offset: 7
    convid: 105
    datasize: 2

  - <<: *temp
    name: "Leaving Water Setpoint Main"
    register: 0x60
    offset: 9
    convid: 105
    datasize: 2

# Sensores Binários
binary_sensor:
  - <<: *binary
    name: "Defrost Operation"
    register: 0x10
    offset: 1
    convid: 304
    datasize: 1

  - <<: *binary
    name: "Thermostat Status"
    register: 0x10
    offset: 1
    convid: 307
    datasize: 1

  - <<: *binary
    name: "Water Pump Operation"
    register: 0x60
    offset: 12
    convid: 301
    datasize: 1

  - <<: *binary
    name: "3-Way Valve (DHW/Space)"
    register: 0x60
    offset: 12
    convid: 306
    datasize: 1

  - <<: *binary
    name: "Backup Heater Step 1"
    register: 0x60
    offset: 12
    convid: 304
    datasize: 1

  - <<: *binary
    name: "Backup Heater Step 2"
    register: 0x60
    offset: 12
    convid: 303
    datasize: 1

# Sensores de Texto / Estados
text_sensor:
  - <<: *text
    name: "Operation Mode"
    icon: mdi:heat-pump
    register: 0x10
    offset: 0
    convid: 217
    datasize: 1

  - <<: *text
    name: "Indoor Unit Operation Mode"
    icon: mdi:heat-pump
    register: 0x60
    offset: 2
    convid: 315
    datasize: 1

  - <<: *text
    name: "Outdoor Error Code"
    icon: mdi:alert-circle-outline
    register: 0x10
    offset: 5
    convid: 204
    datasize: 1

  - <<: *text
    name: "Indoor Error Code"
    icon: mdi:alert-circle-outline
    register: 0x60
    offset: 3
    convid: 204
    datasize: 1
