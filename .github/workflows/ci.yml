name: CI

on:
  pull_request:
    paths:
      - '*.yaml'
      - 'components/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  x10a-unit-tests:
    name: X10A read-only protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile and execute protocol tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic tests/test_x10a_read_protocol.cpp -o /tmp/test_x10a_read_protocol
          /tmp/test_x10a_read_protocol

  ci:
    name: Building ${{ matrix.file }} / ${{ matrix.esphome-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        #### Modify below here to match your project ####
        file:
          - esphome-altherma-esp32
          - esphome-altherma-esp32-s3
          - esphome-altherma-esp8266
          - esphome-altherma-atoms3
        #### Modify above here to match your project ####

        esphome-version:
          - stable
          #- beta
          #- dev
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      - name: ESPHome ${{ matrix.esphome-version }}
        uses: esphome/build-action@v7
        with:
          yaml-file: ${{ matrix.file }}.yaml
          version: ${{ matrix.esphome-version }}
      - name: ESPHome ${{ matrix.esphome-version }} Factory
        uses: esphome/build-action@v7
        with:
          yaml-file: ${{ matrix.file }}.factory.yaml
          version: ${{ matrix.esphome-version }}
