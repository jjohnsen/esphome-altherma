name: Dynamic Sensor Mock POC

on:
  push:
    branches:
      - feature/dynamic-sensors-mock
    paths:
      - "components/altherma_hub/**"
      - "esphome-altherma-dynamic-mock.yaml"
      - "esphome-altherma-ldd-mock.yaml"
      - "tools/ldd*.py"
      - "tests/**"
      - ".github/workflows/dynamic-sensors-mock.yml"
  workflow_dispatch:

jobs:
  validate-ldd:
    name: Validate generated LDD sensor profile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test LDD filtering and C++ profile generation
        run: python3 -m unittest discover -s tests -p 'test_ldd_to_header.py'
      - name: Verify generated header matches decoded LDD sample
        run: |
          python3 tools/ldd_to_header.py tests/fixtures/ldd_lt_da_sample.csv --output /tmp/ldd_generated_profile.h
          diff -u components/altherma_hub/ldd_generated_profile.h /tmp/ldd_generated_profile.h

  build-mock:
    name: Compile ${{ matrix.file }}
    needs: validate-ldd
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file:
          - esphome-altherma-dynamic-mock.yaml
          - esphome-altherma-ldd-mock.yaml
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
      - name: Build ESP32 firmware
        uses: esphome/build-action@v7
        with:
          yaml-file: ${{ matrix.file }}
          version: stable
